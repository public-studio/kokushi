<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>国試｜理容師国家試験</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,sans-serif;background:#fff;color:#222;min-height:100svh;display:grid;place-items:center;margin:0;padding:24px}
    main{text-align:center;width:min(100%,340px)}
    .label{font-size:1rem;color:#666;margin:0 0 10px}
    h1{font-size:2.5rem;margin:0 0 16px;line-height:1.2}
    .date{font-size:1rem;color:#666;margin:0 0 28px}
    .count-label{font-size:.95rem;color:#666;margin:0 0 4px}
    .count{margin:0 0 32px;font-variant-numeric:tabular-nums}
    #days{font-size:3.5rem;font-weight:750;line-height:1.2}
    .unit{font-size:1.2rem;margin-left:6px}
    a{display:block;background:#282333;color:#fff;text-decoration:none;padding:16px;border-radius:12px;font-weight:bold;font-size:1.1rem}
    a:focus-visible{outline:3px solid #777;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="label">理容師国家試験</p>
    <h1>国試</h1>
    <p class="date">2027年3月7日（日）</p>
    <p class="count-label" id="count-label">筆記試験まであと</p>
    <p class="count" aria-live="polite"><span id="days">—</span><span class="unit" id="unit">日</span></p>
    <a href="https://chatgpt.com/?q=%E7%90%86%E5%AE%B9%E5%B8%AB%E5%9B%BD%E5%AE%B6%E8%A9%A6%E9%A8%93%E3%82%B2%E3%83%BC%E3%83%A0%E3%80%8C%E5%9B%BD%E8%A9%A6%E3%80%8D%E3%82%92%E9%96%8B%E5%A7%8B%E3%80%82https%3A%2F%2Fgithub.com%2Fpublic-studio%2Fkokushi%2Fblob%2Fmain%2FAGENTS.md%20%E3%82%92%E5%8F%96%E5%BE%97%E3%81%97%E3%80%81%E6%9C%80%E6%96%B0%E7%89%88%E3%81%AE%E6%89%8B%E9%A0%86%E3%81%A7%E7%B6%9A%E3%81%8D%E3%81%8B%E3%82%89%E9%96%8B%E5%A7%8B%E3%81%97%E3%81%A6%E3%81%8F%E3%81%A0%E3%81%95%E3%81%84%E3%80%82">スタート</a><a style="margin-top:12px;background:#245b70" href="/apps/">ミニゲーム</a>
  </main>
  <script>
    function remainingDays(now) {
      const parts = new Intl.DateTimeFormat('ja-JP', {timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now);
      const get = type => Number(parts.find(p => p.type === type).value);
      const today = Date.UTC(get('year'), get('month')-1, get('day'));
      return (Date.UTC(2027,2,7)-today)/86400000;
    }
    function updateCountdown() {
      const days = remainingDays(new Date());
      document.getElementById('days').textContent = Math.max(0,days);
      document.getElementById('count-label').textContent = days < 0 ? '筆記試験終了' : days === 0 ? '今日は筆記試験当日' : '筆記試験まであと';
      document.getElementById('unit').hidden = days <= 0;
      document.getElementById('days').hidden = days <= 0;
    }
    updateCountdown();
    setInterval(updateCountdown, 1000 * 60);
    document.addEventListener('visibilitychange', updateCountdown);
    window.addEventListener('pageshow', updateCountdown);
  </script>
</body>
</html>
