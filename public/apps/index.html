<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国試 | 実習ラッシュ</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#244d72,#101326 70%);color:#fff;font:16px system-ui;min-height:100svh}main{max-width:600px;margin:auto;padding:20px}a{color:#a9e7ff}h1{margin:12px 0;font-size:32px}button{font:inherit;color:inherit;background:#233b57;border:1px solid #6197b0;border-radius:16px;padding:16px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.96)}.hud{display:flex;justify-content:space-between;gap:8px;color:#a9e7ff;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:116px;display:grid;place-items:center;gap:4px;font-size:18px}.art{font-size:44px}.panel{background:#ffffff0c;border:1px solid #ffffff26;border-radius:22px;padding:20px;margin:16px 0}.bar{height:8px;background:#ffffff20;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#58e6d0;transition:width .3s}.good{animation:pop .35s;background:#176d57}.bad{background:#853c52}@keyframes pop{50%{transform:scale(1.08);box-shadow:0 0 30px #52ffb8}}#feedback{min-height:72px;color:#e0f8ff}#next,#again,#back{width:100%;margin-top:10px}small{color:#b9c9df} [hidden]{display:none!important}
</style><main><a href="/">← 国試</a><h1>実習ラッシュ</h1><p>見て、タップして、覚えよう。</p><section id="menu" class="panel"><div class="grid"><button id="tools" class="tile"><span class="art">✂️</span>器具マスター</button><button id="body" class="tile"><span class="art">🧬</span>毛髪・皮膚</button></div><p><small>オリジナル練習ゲーム・時間制限なし</small></p></section><section id="play" hidden><div class="hud"><span id="progress"></span><span id="score"></span><span id="combo"></span><span id="clock"></span></div><div class="bar"><i id="bar"></i></div><div class="panel"><h2 id="question"></h2><div id="choices" class="grid"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>次へ →</button></div></section><section id="result" class="panel" hidden><h2>クリア！</h2><p id="summary"></p><button id="again">もう一度</button><button id="back">ChatGPTで復習する</button><button id="copy">結果をコピー</button><p id="status"></p></section></main><script>
const bank={tools:[['毛髪を切る器具は？','シザー','コーム','クリッパー','ブラシ','シザーは毛髪を切るためのはさみ。'],['毛髪をとかして整える器具は？','コーム','シザー','レザー','クリッパー','コームは毛髪をとかし、分ける器具。'],['電動で毛髪を刈る器具は？','クリッパー','コーム','ブラシ','レザー','クリッパーは電動の刈り上げ器具。'],['顔そりに使う器具は？','レザー','コーム','シザー','ブラシ','レザーは顔そりなどに用いる。']],body:[['毛髪の最も外側は？','毛小皮','毛皮質','毛髄質','毛乳頭','毛小皮（キューティクル）は毛髪の外側を覆う。'],['毛髪の色や強さに深く関わる部分は？','毛皮質','毛小皮','毛乳頭','皮脂腺','毛皮質は毛髪の大部分を占め、メラニンを含む。'],['皮膚の最も外側の層は？','表皮','真皮','皮下組織','筋膜','表皮は外界に接する皮膚の層。'],['皮脂を分泌するのは？','皮脂腺','汗腺','毛小皮','毛髄質','皮脂腺は皮脂を分泌する。']]};const icons={'シザー':'✂️','コーム':'▥','クリッパー':'▤','ブラシ':'▧','レザー':'▱'};const $=id=>document.getElementById(id);let mode,qs,i,points,combo,records,start,round,locked,runId;const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);function begin(m){mode=m;qs=shuffle(bank[m]);i=points=combo=0;records=[];start=performance.now();runId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);$('menu').hidden=$('result').hidden=true;$('play').hidden=false;show()}function hud(){$('progress').textContent=(i+1)+' / '+qs.length;$('score').textContent=points+' PT';$('combo').textContent=combo+' COMBO';$('bar').style.width=(i/qs.length*100)+'%'}function show(){locked=false;round=performance.now();hud();let q=qs[i];$('question').textContent=q[0];$('feedback').textContent='';$('next').hidden=true;$('choices').replaceChildren();for(const v of shuffle(q.slice(1,5))){let b=document.createElement('button');b.className='tile';if(icons[v]){let s=document.createElement('span');s.className='art';s.textContent=icons[v];b.append(s)}b.append(document.createTextNode(v));b.onclick=()=>answer(v,b);$('choices').append(b)}}function answer(v,b){if(locked)return;locked=true;let q=qs[i],ok=v===q[1];combo=ok?combo+1:0;points+=ok?100+20*(combo-1):0;records.push({question:q[0],answer:v,correct:q[1],ok,seconds:Math.round((performance.now()-round)/100)/10});for(const el of $('choices').children){el.disabled=true;if(el.textContent.endsWith(q[1]))el.classList.add('good')}if(!ok)b.classList.add('bad');$('feedback').textContent=(ok?'NICE! ':'覚えよう！ ')+q[5];hud();$('next').hidden=false}function finish(){$('play').hidden=true;$('result').hidden=false;const result={game:mode,runId,points,records,seconds:Math.round((performance.now()-start)/1000)};const msg='国試 HTMLミニゲーム結果：'+JSON.stringify(result)+'。https://github.com/public-studio/kokushi/blob/main/AGENTS.md を読み、結果を重複なく記録し、間違えた分野を復習して続きから進めてください。';$('summary').textContent=records.filter(r=>r.ok).length+' / '+records.length+' 正解　'+points+' PT';try{localStorage.setItem('kokushi-last',JSON.stringify(result))}catch{}$('back').onclick=()=>location.href='https://chatgpt.com/?q='+encodeURIComponent(msg);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('status').textContent='コピーしました'}catch{$('status').textContent=msg}}} $('tools').onclick=()=>begin('tools');$('body').onclick=()=>begin('body');$('next').onclick=()=>{if(++i===qs.length)finish();else show()};$('again').onclick=()=>{$('result').hidden=true;$('menu').hidden=false};setInterval(()=>{if(!$('play').hidden){let s=Math.floor((performance.now()-start)/1000);$('clock').textContent='◷ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},250);const m=new URLSearchParams(location.search).get('mode');if(bank[m])begin(m);
</script></html>
