document.querySelectorAll('.shared-presets [data-name]').forEach(b=>b.onclick=()=>void changeSharedName(b.dataset.name));
$('sharedForm').onsubmit=e=>{e.preventDefault();void changeSharedName($('sharedName').value)};
function setup(){try{let runs=JSON.parse(localStorage.getItem('kokushi.timeattack.v1')||'[]');for(const run of runs){if(run.version!==4||!Array.isArray(run.records))continue;for(const r of run.records){if(typeof r.ok!=='boolean')continue;let k=JSON.stringify([r.question,r.correct]);localStreak.set(k,r.ok?0:Math.min(2,(localStreak.get(k)||0)+1));}}}catch{}void loadIdentity().then(()=>pollLobby());}
window.addEventListener('storage',e=>{if(e.key===SHARE_KEY&&!socket&&!identityBusy){sharedIdentity=readIdentity();drawName();}});
window.addEventListener('pageshow',e=>{if(e.persisted&&!socket)void loadIdentity()});


let lobbyEpoch=0,matchRoom=null,pollJob=null,matchTimeout=null,leaving=false,releaseJob=null;
let autoEntry=new URL(location.href).searchParams.get('auto')==='1';
async function lobbyAPI(action,room){const res=await fetch('/api/battle/lobby',{method:'POST',headers:{Authorization:'Bearer '+sharedIdentity.token,'Content-Type':'application/json'},body:JSON.stringify({action,room}),cache:'no-store',keepalive:action==='done'||action==='idle'});if(!res.ok)throw Error('通信に失敗しました');return res.json();}
function statusMessage(text){$('lobbyStatus').textContent=text;$('lobbyStatus').hidden=!text;}
async function shareInvite(){
 const url=new URL('/apps/rush',location.origin).href;const data={title:'国試ラッシュ',text:'一緒に国試ラッシュで対戦しよう！',url};
 if(navigator.share){try{await navigator.share(data);return}catch(e){if(e?.name==='AbortError')return;}}
 try{await navigator.clipboard.writeText(data.text+'\n'+url);statusMessage('招待リンクをコピーしました');}catch{window.prompt('招待リンクをコピー',data.text+' '+url);}
}
function pollLobby(){if(leaving||pollJob||releaseJob||identityBusy||socket||!sharedIdentity?.token||document.hidden)return;let epoch=lobbyEpoch;pollJob=(async()=>{try{const v=await lobbyAPI('auto');if(epoch!==lobbyEpoch||document.hidden||leaving)return;if(v.room&&v.room!==matchRoom){matchRoom=v.room;connectMatch(v.room);}else if(autoEntry&&!v.room){leaving=true;location.replace('/apps/time-attack.html');}}catch{}finally{pollJob=null;}})();return pollJob;}
function releaseMatch(){if(releaseJob)return releaseJob;const room=matchRoom;matchRoom=null;if(!room||!sharedIdentity?.token)return Promise.resolve();releaseJob=(async()=>{try{await lobbyAPI('done',room)}catch{}finally{releaseJob=null}})();return releaseJob;}
async function closeRoom(){if(leaving)return;leaving=true;++lobbyEpoch;clearTimeout(matchTimeout);clearInterval(pingTimer);let old=socket;socket=null;try{old?.close()}catch{}active=false;stopMusic();state=null;await releaseMatch();location.replace('/apps/time-attack.html');}
function connectMatch(room){playedRound=resultRound=0;soloStart=0;leaseAt=0;lastCount=null;specialReady=false;state=null;active=false;pending=false;shown=-1;lastAction=null;shots=[];flashes=[];feverUntil=0;prevFever=false;resetFlick();$('delta').textContent='';$('battleAction').hidden=true;const name=sharedIdentity?.name;if(!/^[a-f0-9]{10}$/.test(room)||!/^[A-Z0-9]{1,4}$/.test(name||''))return;const u=new URL('/api/battle/ws',location.href);u.protocol=location.protocol==='https:'?'wss:':'ws:';u.searchParams.set('room',room);u.searchParams.set('name',name);u.searchParams.set('handicap','1');bestRtt=Infinity;offset=0;let ws=new WebSocket(u);socket=ws;namePanel(false);drawName();statusMessage('対戦準備中…');playSound(()=>prepareMusic());
matchTimeout=setTimeout(()=>{if(socket===ws&&!state)void closeRoom()},12000);
ws.onopen=()=>{if(socket!==ws)return;send({type:'ping',echo:Date.now()});pingTimer=setInterval(()=>{send({type:'ping',echo:Date.now()});if(Date.now()-leaseAt>=5000){leaseAt=Date.now();void lobbyAPI('auto',room).catch(()=>{});}},1500);};
ws.onmessage=e=>{if(socket!==ws)return;let m;try{m=JSON.parse(e.data)}catch{return;}if(m.type==='state')clearTimeout(matchTimeout);receive(m);};
ws.onclose=()=>{if(socket!==ws)return;clearInterval(pingTimer);clearTimeout(matchTimeout);socket=null;if(!leaving)scheduleSolo(soloStart||Math.max(now()+3000,state?.nextStart||0));};
ws.onerror=()=>{if(socket===ws)statusMessage('対戦接続中…');};
}
function receive(m){
if(m.type==='joined'){me=m.i;return}
if(m.type==='pong'){let rtt=Date.now()-m.echo;if(rtt>=0&&rtt<bestRtt){bestRtt=rtt;offset=m.now-(m.echo+rtt/2)}return}
if(m.type==='expired'){scheduleSolo(now()+3000);return;}
if(m.type==='solo'){scheduleSolo(m.start);return;}
if(m.type==='state'){if(!state&&bestRtt===Infinity)offset=m.now-Date.now();let prev=state?.players?.[me]?.n;state=m;if(m.round!==playedRound&&!m.finished){playedRound=m.round;shown=-1;pending=false;lastAction=null;lastCount=null;specialReady=false;specialNoticeUntil=0;shots=[];flashes=[];resetFlick();$('delta').textContent='';$('card').classList.remove('good','bad');}if(m.players[me].n!==prev)pending=false;active=!m.finished&&now()>=m.start&&now()<m.end;if(!m.finished){$('lobby').hidden=true;$('battleResult').hidden=true;$('play').hidden=false;renderQuestion();}else if(resultRound!==m.round){resultRound=m.round;finish(m);}return;}
if(m.type==='answer'&&m.i===me){let q=BANK[m.n-1];if(q){let k=JSON.stringify([q.question,q.correct]);localStreak.set(k,m.ok?0:Math.min(2,(localStreak.get(k)||0)+1));}return;}
if(m.type==='fire'){shots.push({...m,received:performance.now()});if(m.kind==='special'||m.kind==='reverse')playSound(()=>cueSound(true));}
if(m.type==='impact'||m.type==='clash'){flashes.push({t:performance.now(),kind:m.type,i:m.i});if(m.type==='clash')$('delta').textContent='相殺！';}
if(m.type==='fever'&&m.i===me){playSound(feverSound);}
if(m.type==='grade'&&m.i===me){$('actionText').textContent=['MISS','GOOD!','GREAT!','PERFECT!!'][m.grade];}
}
function renderQuestion(){let x=state.players[me];if(x.n===shown)return;shown=x.n;pending=false;const q=BANK[x.n];if(!q){$('question').textContent='全問回答！';$('left').disabled=$('right').disabled=true;return;}let correct=Number(FIXED_SIDES[x.n]);renderRuby($('question'),q.question);renderRuby($('left').firstElementChild,correct===0?q.correct:q.wrong);renderRuby($('right').firstElementChild,correct===1?q.correct:q.wrong);}
function answer(i){if(!active||!state||pending||state.players[me].action||shown>=BANK.length)return;pending=true;let n=shown,ok=Number(FIXED_SIDES[n])===i;send({type:'answer',n,choice:i,assist:localStreak.get(JSON.stringify([BANK[n].question,BANK[n].correct]))>=2?'repeat':state.hint!==null?'delay':null});$('delta').textContent=ok?'HIT!':'MISS';$('card').classList.toggle('good',ok);$('card').classList.toggle('bad',!ok);playSound(()=>ok?hitSound(state.players[me].combo+1,feverOn()):missSound());setTimeout(()=>{$('card').classList.remove('good','bad');if(shown===n)pending=false;},250);}
function color(v){if(v>=100)return 'linear-gradient(90deg,#efa025,#fff9bd)';let a=['#1769d1','#258ed0','#48cba0','#f1d64c','#ff983d'],b=['#40adff','#40dc9b','#f5e34c','#ff983d','#ff4141'],i=Math.min(4,Math.floor(v/20));return 'linear-gradient(90deg,'+a[i]+','+b[i]+')';}
const canvas=$('actionCanvas'),ctx=canvas.getContext('2d'),fx=$('battleFX'),fctx=fx.getContext('2d');
function drawTimingRing(r,col,w){ctx.beginPath();ctx.arc(160,90,Math.max(.1,r),0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();}
function actionDraw(a,t){ctx.clearRect(0,0,320,180);if(!a)return;let d=Math.max(0,t-a.start),ph=d%1100,r=23+55*(ph<=1000?1-ph/1000:(ph-1000)/100);let g=ctx.createRadialGradient(160,90,0,160,90,70);g.addColorStop(0,'#fff8bf');g.addColorStop(.18,'#ffb337');g.addColorStop(1,'#ff780000');ctx.fillStyle=g;ctx.fillRect(70,0,180,180);ctx.textAlign='center';ctx.font='900 28px system-ui';ctx.fillStyle='#fff6b8';if(a.type==='special'){ctx.fillText(a.count+' HIT!!',160,98);}else{drawTimingRing(23,'#ffe36b',3);drawTimingRing(r,'#67edff',3);drawTimingRing(r+7,'#67edff55',2);ctx.font='bold 14px system-ui';ctx.fillText('● '.repeat(2-a.count)+'○ '.repeat(a.count),160,172);}$('actionTime').style.width=Math.max(0,100*(1-d/a.duration))+'%';}
function fxDraw(t){fctx.clearRect(0,0,340,80);for(let s of shots){let u=Math.max(0,Math.min(1,(t-s.received)/280)),own=s.i===me,x=own?15+310*u:325-310*u,y=40+Math.sin(s.received)*9,col=own?'#67edff':'#ff9474';fctx.strokeStyle=col;fctx.shadowColor=col;fctx.shadowBlur=12;fctx.lineWidth=s.kind==='reverse'?10:4;fctx.beginPath();fctx.moveTo(x-(own?1:-1)*(s.kind==='reverse'?40:15),y);fctx.lineTo(x,y);fctx.stroke();fctx.fillStyle='#fff9c4';fctx.beginPath();fctx.arc(x,y,s.kind==='reverse'?8:4,0,Math.PI*2);fctx.fill();}fctx.shadowBlur=0;for(let v of flashes){let u=(t-v.t)/350;fctx.globalAlpha=Math.max(0,1-u);fctx.strokeStyle='#ffe36b';fctx.lineWidth=3;fctx.beginPath();fctx.arc(v.kind==='clash'?170:v.i===me?325:15,40,4+u*32,0,Math.PI*2);fctx.stroke();}fctx.globalAlpha=1;shots=shots.filter(s=>t-s.received<300);flashes=flashes.filter(v=>t-v.t<350);}
function frame(t){if(state&&!state.finished){let time=now(),a=state.players[me],b=state.players[1-me],p=me===0?state.p:100-state.p,left=Math.max(0,state.end-time-Math.max(0,...state.players.map(v=>v.fever-time))),sec=Math.min(60,Math.ceil(left/1000));active=time>=state.start&&time<state.end;const count=Math.ceil((state.start-time)/1000);$('roundOverlay').hidden=count<=0;$('roundTitle').textContent='ROUND '+state.round+'　'+state.players[me].name+' VS '+state.players[1-me].name;$('roundCount').textContent=count;if(count!==lastCount){if(count>0)playSound(()=>cueSound(true));else if(lastCount>0)playSound(()=>{startSound();prepareMusic()});lastCount=count;}feverUntil=a.fever;$('clock').textContent=time<state.start?Math.ceil((state.start-time)/1000):Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('clockRing').style.strokeDashoffset=100-Math.min(100,left/600);$('bar').style.width=p+'%';$('combo').textContent=a.combo;$('opCombo').textContent=b.combo;$('myName').textContent=a.name+' COMBO';$('opName').textContent=b.name;$('number').textContent=(Math.min(80,a.n+1))+'問目';$('opNumber').textContent='相手 '+Math.min(80,b.n+1)+'問目';$('comboFill').style.width=(a.combo?Math.max(0,Math.min(100,(a.until-time)/(a.combo<10?40:a.combo<20?35:30))):0)+'%';$('comboTime').textContent=a.combo?'●':'—';let f=time<a.fever;$('play').classList.toggle('fever-active',f);$('play').classList.toggle('pinch',p<=15);$('feverFlag').textContent=f?'FEVER!! · TIME STOP':time<b.fever?'相手 FEVER!! · TIME STOP':'';$('feverFill').style.width=(f?Math.max(0,(a.fever-time)/50):Math.max(0,Math.min(100,(1-(a.nextFever-a.combo)/10)*100)))+'%';$('feverHint').textContent=f?'攻撃 ×2':'あと'+Math.max(1,a.nextFever-a.combo)+'コンボ';
for(let [id,x] of [['myPips',a],['opPips',b]]){let el=$(id),f=time<x.fever,n=f?Math.ceil((x.fever-time)/500):Math.max(0,Math.min(10,10-(x.nextFever-x.combo)));el.classList.toggle('fever',f);Array.from(el.children).forEach((v,i)=>v.classList.toggle('lit',i<n));}for(let [id,v] of [['mySpecial',a.g],['opSpecial',b.g]]){$(id).style.width=v+'%';$(id).style.background=color(v);}
if(a.g>=100&&!specialReady){specialNoticeUntil=time+1500;playSound(specialReadySound);}specialReady=a.g>=100;$('specialNotice').hidden=time>=specialNoticeUntil||!active;$('special').classList.toggle('ready',a.g>=100);$('special').disabled=!active||a.g<100||!!a.action;$('special').firstElementChild.textContent=a.g>=100?'⚡ SPECIAL READY!!':'⚡ SPECIAL';$('reverse').hidden=true;if(time<a.protectedUntil)$('feverFlag').textContent=a.action?.type==='reverse'?'⚡ PINCH BREAK!! 無敵':'⚡ 無敵・復帰中';
let q=BANK[a.n],hint=q&&localStreak.get(JSON.stringify([q.question,q.correct]))>=2?Number(FIXED_SIDES[a.n]):state.hint;
$('left').classList.toggle('memory-assist',active&&hint===0&&!a.action);$('right').classList.toggle('memory-assist',active&&hint===1&&!a.action);
$('left').disabled=$('right').disabled=!active||!!a.action||a.n>=BANK.length;
$('battleAction').hidden=!a.action;if(a.action){let k=a.action.type+':'+a.action.start;if(k!==lastAction){lastAction=k;$('actionText').textContent=a.action.type==='special'?'連打で撃ちまくれ！！':'PINCH BREAK!! 無敵 — 光が重なる瞬間にタップ！';} $('actionHit').textContent=a.action.type==='special'?'TAP! TAP! TAP!':'⚡ 発射！';$('actionHit').disabled=time<a.action.start;actionDraw(a.action,time);}else lastAction=null;
if(active){syncMusic(performance.now());}else stopMusic();
}else if(state?.finished){$('nextRound').textContent=(soloStart?'NEXT — SOLO':'NEXT ROUND '+(state.round+1))+'　'+Math.max(0,Math.ceil(((soloStart||state.nextStart)-now()-3000)/1000));}fxDraw(t);requestAnimationFrame(frame);}
function saveBattle(m){const a=m.players[me],records=m.records||[];if(!a.n)return;const id=m.seriesId+'-'+m.round+'-'+me,date=new Date(m.finishedAt||m.now).toISOString(),r={game:'time-attack',mode:'battle',version:4,runId:id,startedAt:new Date(m.start).toISOString(),date,durationSeconds:Math.max(0,Math.round(((m.finishedAt||m.now)-m.start)/100)/10),bonusSeconds:m.bonusMs/1000,feverCount:a.feverCount,feverCorrect:a.feverCorrect,points:a.points,answered:a.n,correct:a.correct,incorrect:a.n-a.correct,accuracy:Math.round(1000*a.correct/a.n)/10,rank:rankFor(a.points),rankScaleVersion:3,maxCombo:a.maxCombo,comboRate:Math.round(1000*records.filter(v=>v.comboContinued).length/a.n)/10,records,reason:m.reason};try{const h=JSON.parse(localStorage.getItem('kokushi.timeattack.v1')||'[]');if(!h.some(v=>v.runId===id)){h.push(r);localStorage.setItem('kokushi.timeattack.v1',JSON.stringify(h));}}catch{}if(sharedIdentity?.token)void sharedAPI('runs',{runs:[{id,date,points:a.points,maxCombo:a.maxCombo,answered:a.n,rushEligible:a.correct*5>=a.n*3}]}).catch(()=>{});}
function finish(m){active=false;autoEntry=false;stopMusic();$('roundOverlay').hidden=true;$('specialNotice').hidden=true;$('play').hidden=true;$('lobby').hidden=true;$('battleResult').hidden=false;$('winner').textContent=m.winner===null?'DRAW':m.winner===me?'YOU WIN!!':'YOU LOSE';$('winner').classList.toggle('lose',m.winner!==null&&m.winner!==me);let a=m.players[me];$('seriesScore').textContent=a.name+'　'+m.wins[me]+'勝 '+m.wins[1-me]+'敗'+(m.draws?' '+m.draws+'分':'');$('battleRank').textContent=rankFor(a.points);$('battleScore').textContent=a.points.toLocaleString()+' SCORE';$('resultInfo').textContent='正解 '+a.correct+' / '+a.n+'問　最大 '+a.maxCombo+' COMBO';saveBattle(m);playSound(()=>endSound(m.winner===me,false));}
function scheduleSolo(start){if(soloStart||leaving)return;soloStart=start;active=false;stopMusic();clearInterval(pingTimer);clearTimeout(matchTimeout);const delay=Math.max(0,start-now()-3000);setTimeout(()=>{if(leaving)return;leaving=true;let old=socket;socket=null;try{old?.close()}catch{}const target=Date.now()+Math.max(0,start-now());void releaseMatch();location.replace('/apps/rush?solo='+Math.round(target));},delay);}
$('shareInvite').onclick=()=>{void shareInvite()};$('back').onclick=()=>void closeRoom();setInterval(pollLobby,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)void pollLobby();else if(!socket&&sharedIdentity?.token)void lobbyAPI('idle').catch(()=>{});});window.addEventListener('pagehide',()=>{if(socket){try{socket.close()}catch{}}else if(sharedIdentity?.token)void lobbyAPI('idle').catch(()=>{});});document.addEventListener('pointerdown',()=>{if(socket)playSound(()=>{prepareMusic();syncMusic(performance.now())})},{passive:true});$('left').onclick=()=>answer(0);$('right').onclick=()=>answer(1);$('special').onclick=()=>send({type:'special'});$('reverse').onclick=()=>send({type:'reverse'});function hit(e){e.preventDefault();if(state?.players[me]?.action&&now()>=state.players[me].action.start)send({type:'hit',at:Math.round(now())});}$('actionHit').addEventListener('pointerdown',hit);canvas.addEventListener('pointerdown',hit);
function resetFlick(){const card=$('card');card.classList.remove('dragging');card.style.transform='';$('left').classList.remove('targeted');$('right').classList.remove('targeted');gesture=null}
$('card').addEventListener('pointerdown',e=>{if(!active||!e.isPrimary||e.button!==0)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};$('card').classList.add('dragging');try{$('card').setPointerCapture(e.pointerId)}catch{}});

$('card').addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;resetFlick();if(active&&Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy)*1.2)answer(dx<0?0:1)});
$('card').addEventListener('pointercancel',resetFlick);$('card').addEventListener('lostpointercapture',resetFlick);document.addEventListener('keydown',e=>{if(!active||e.repeat)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();answer(e.key==='ArrowLeft'?0:1)}});
for(const id of ['myPips','opPips'])$(id).innerHTML='<i></i>'.repeat(10);setup();requestAnimationFrame(frame);
