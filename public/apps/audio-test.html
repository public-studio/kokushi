<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国試ラッシュ 音声テスト</title><style>body{background:#10131d;color:#fff;font:17px system-ui;margin:0;padding:24px}main{max-width:480px;margin:auto}button{display:block;width:100%;margin:12px 0;padding:18px;border:1px solid #7dadd9;border-radius:14px;background:#233e60;color:white;font:inherit;font-weight:bold}output{display:block;background:#202a3b;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:14px}a{color:#a6d9ff}p{line-height:1.6}</style></head><body><main><h1>音声テスト</h1><p>それぞれのボタンを押して、音が聞こえるか確認してください。</p><button id="original">① 初期版と同じ音</button><button id="media">② 別の再生方式の音</button><output id="status">未テスト</output><p><a href="./time-attack.html">国試ラッシュへ戻る</a></p></main><script>
const $=id=>document.getElementById(id),log=s=>$('status').textContent=s;let ctx,player;
$('original').onclick=async()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('Web Audio非対応');ctx=ctx||new C();await ctx.resume();const t=ctx.currentTime;for(const [p,d] of [[520,0],[660,.15],[880,.3]]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=p;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.075,t+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d+.13);o.connect(g);g.connect(ctx.destination);o.start(t+d);o.stop(t+d+.14)}log('① Web Audio: '+ctx.state+'（音が聞こえたか確認）')}catch(e){log('① エラー: '+e.message)}};
function wav(){const rate=22050,n=Math.round(rate*.65),b=new ArrayBuffer(44+n*2),v=new DataView(b);const s=(i,t)=>[...t].forEach((c,j)=>v.setUint8(i+j,c.charCodeAt(0)));s(0,'RIFF');v.setUint32(4,36+n*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++){const t=i/rate,k=Math.floor(t/.2),d=t-k*.2,p=[520,660,880][k]||880,e=Math.max(0,Math.min(1,d/.008,(.16-d)/.09));v.setInt16(44+2*i,Math.round(12000*e*Math.sin(2*Math.PI*p*d)),true)}return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
player=new Audio(wav());player.preload='auto';$('media').onclick=async()=>{try{player.currentTime=0;await player.play();log('② HTML Audio: 再生開始（音が聞こえたか確認）')}catch(e){log('② エラー: '+e.message)}};
</script></body></html>
