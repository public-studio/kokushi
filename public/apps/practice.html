<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>国試｜理容実習室</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b23;color:#f6f2e9;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:14px 16px 30px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#e0c79b}button{font:inherit;color:inherit;border:1px solid #526169;background:#263844;border-radius:10px;padding:13px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #e6bd7a}button:disabled{opacity:.45}h1,h2,p{margin:8px 0}small{color:#a9b8c0}.hero{background:linear-gradient(0deg,#101b23 0%,transparent 70%),url('../assets/practice-room.webp') center 36%/cover;aspect-ratio:2.1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;border-radius:14px;overflow:hidden;margin:12px 0}.hero h1{font-size:30px;text-shadow:0 2px 7px #000}.panel{background:#1c2a34;border:1px solid #354854;border-radius:15px;padding:15px;margin:12px 0}.gold{color:#f5cf8e}.primary{background:#e4bf81;color:#17212a;font-weight:700;border:0;width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:82px;text-align:left}.card b{display:block;font-size:16px;margin-bottom:4px}.meter{height:6px;background:#3c4b51;border-radius:8px;overflow:hidden;margin:7px 0}.meter i{height:100%;background:#e8bb75;display:block;transition:width .25s}.badge{font-size:12px;color:#b3c9bf}.score{font-size:23px;font-weight:700}.flash{animation:flash .35s}@keyframes flash{50%{transform:scale(1.025);border-color:#e9c381}}.good{color:#a6e5b6}.bad{color:#ffcb9b}.muted{color:#b3c3cb}.headzone{position:relative;width:min(100%,300px);height:220px;margin:8px auto}.head{position:absolute;left:25%;width:50%;height:84%;top:8%;background:#d6a080;border-radius:46% 46% 40% 40%;box-shadow:inset -12px -5px 0 #b8795b}.ear{position:absolute;left:18%;top:45%;width:16%;height:24%;border-radius:50%;background:#c99674}.ear.r{left:66%}.zone{position:absolute;padding:4px;border:2px solid #9d8469;background:repeating-linear-gradient(100deg,#26231f 0 4px,#514137 4px 6px);color:white;text-shadow:0 1px 3px black;box-shadow:inset 0 -8px 15px #0006;font-size:14px;font-weight:bold;transition:background .2s}.zone.top{top:0;left:24%;width:52%;height:45%;border-radius:50% 50% 24% 24%}.zone.left{top:26%;left:15%;height:40%;width:24%;border-radius:35% 0 50% 50%}.zone.right{top:26%;left:61%;height:40%;width:24%;border-radius:0 35% 50% 50%}.zone.back{top:61%;left:35%;height:27%;width:30%;border-radius:0 0 45% 45%}.zone.cut{background:repeating-linear-gradient(90deg,#56473d 0 2px,#997d63 2px 4px);border-color:#8bd6aa;box-shadow:0 0 12px #8bd6aa66}.tool.selected{border:2px solid #e4bf81;background:#4a4231}.steps{display:flex;gap:6px;margin:12px 0}.steps span{flex:1;height:4px;background:#43545e;border-radius:4px}.steps .active{background:#e9bb77}.steps .clear{background:#8ccca6}#feedback{min-height:52px;border-left:3px solid #d1b37a;padding:8px 12px;background:#15232c;border-radius:6px}#result h2{font-size:30px}[hidden]{display:none!important}
</style></head><body><main><header><a href="/apps/">← 国試</a><span class="gold">理容実習室</span><span id="clock"></span></header>
<section id="lobby"><div class="hero"><small>実習課程</small><h1>理容実習室</h1><span>今日の実習を始めよう。</span></div><div class="panel"><div class="row"><b id="rank"></b><span id="xp" class="gold"></span></div><div class="meter"><i id="xpbar"></i></div><small id="total"></small></div><div id="missions" class="grid"></div><p><small>オリジナル実習シミュレーション。国家試験の知識を復習するためのゲームです。</small></p></section>
<section id="work" hidden><div class="row"><b id="mission"></b><span id="sessionxp" class="gold">+0 XP</span></div><div id="steps" class="steps"></div><div class="panel"><div class="row"><small id="stage"></small><small id="streak"></small></div><h2 id="task"></h2><p id="request" class="muted"></p><div id="area"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" hidden>次の工程へ</button></div><button id="quit">実習室に戻る</button></section>
<section id="result" class="panel" hidden><small>実習終了</small><h2 id="grade"></h2><div class="row"><span>今回の経験値</span><span id="earned" class="score gold"></span></div><div class="row"><span>一度でできた工程</span><b id="accuracy"></b></div><div id="review"></div><button id="again" class="primary">次の実習を選ぶ</button><button id="gpt" style="width:100%;margin-top:10px">ChatGPTで復習する</button><button id="copy" style="width:100%;margin-top:8px">結果をコピー</button><p id="copyStatus"></p></section></main><script>
const $=id=>document.getElementById(id);
const missions=[
{id:'basic',title:'基本の実習',desc:'器具準備・消毒・刈り上げ',req:0,style:'短く整えたいお客様',tasks:['wash','disinfect','tools','cut','finish']},
{id:'finish',title:'仕上げの実習',desc:'毛量調整・頭皮・仕上げ',req:1,style:'毛量を軽くしたいお客様',tasks:['wash','disinfect','thin','cut','skin','finish']},
{id:'clean',title:'衛生管理の実習',desc:'器具・手指・感染予防',req:0,style:'次のお客様を迎える準備',tasks:['wash','disinfect','hands','blood','finish']}
];
const questions={
wash:{title:'器具の準備',q:'使用済みのコームに毛髪が残っている。まず何をする？',options:['毛髪や汚れを取り除き洗浄する','そのまま次の人に使う','乾いた布で包む'],answer:0,why:'付着物を除去して洗浄し、その後に適切な消毒を行う。'},
disinfect:{title:'衛生管理',q:'洗浄を終えた器具を次のお客様に使う前に？',options:['器具に適した方法で消毒する','水気だけを拭く','消臭スプレーをかける'],answer:0,why:'洗浄だけで終えず、器具や汚染状態に合った消毒を行う。'},
tools:{title:'器具選択',q:'短い刈り上げに適した電動器具を準備しよう。',options:['クリッパー','コーム','ブラシ'],answer:0,why:'クリッパーは短く刈りそろえるのに使う。'},
thin:{title:'器具選択',q:'長さを大きく変えず、毛量を調整する器具は？',options:['セニングシザー','レザー','スプレーヤー'],answer:0,why:'セニングシザーは毛量調整に使う。'},
hands:{title:'手指の衛生',q:'次のお客様に触れる前に行うことは？',options:['手指を清潔にする','エプロンだけ交換する','器具の電源を切るだけ'],answer:0,why:'手指の衛生は交差汚染の予防に重要。'},
blood:{title:'汚染への対応',q:'血液が付着した器具を見つけた。どうする？',options:['使用を止め、血液付着器具に適した消毒手順で処理する','水洗いだけで再使用する','他の器具とそのまま一緒にする'],answer:0,why:'血液が付着した器具は通常の汚れと区別して適切な処理が必要。'},
skin:{title:'頭皮の観察',q:'頭皮の一番外側を覆っている層は？',options:['表皮','真皮','皮下組織'],answer:0,why:'表皮は皮膚の最外層。'},
finish:{title:'次の準備',q:'実習が終わった。次のお客様のために行うことは？',options:['器具と作業場所を清潔に整える','毛髪を床に残す','使用済みタオルを使い回す'],answer:0,why:'作業場所の清掃と器具の衛生管理は次の施術にもつながる。'}
};
const tools=[['clip','クリッパー'],['scissors','シザー'],['thin','セニング'],['comb','コーム']];
const zones=[['top','トップ'],['left','左サイド'],['right','右サイド'],['back','えり足']];
let saved={xp:0,completed:0,cleared:[]};try{let x=JSON.parse(localStorage.getItem('kokushi-practice-v1'));if(x&&Number.isFinite(x.xp)&&Array.isArray(x.cleared))saved=x}catch{}
let run=null,stageStart=0,selected='',cut=new Set(),locked=false,token=0;
function save(){try{localStorage.setItem('kokushi-practice-v1',JSON.stringify(saved))}catch{}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function view(id){for(let n of ['lobby','work','result'])$(n).hidden=n!==id}
function lobby(){run=null;view('lobby');$('clock').textContent='';$('rank').textContent='実習ランク '+(1+Math.floor(saved.xp/300));$('xp').textContent=saved.xp+' XP';$('xpbar').style.width=(saved.xp%300/3)+'%';$('total').textContent='実習修了 '+saved.completed+' 回';$('missions').replaceChildren();for(const m of missions){let b=document.createElement('button');b.className='card';let t=document.createElement('b');t.textContent=m.title;b.append(t,document.createTextNode(m.desc));if(saved.cleared.includes(m.id))b.append(document.createElement('br'),document.createTextNode('✓ 修了済み'));if(saved.completed<m.req){b.disabled=true;b.append(document.createElement('br'),document.createTextNode('基本実習1回で解放'))}b.onclick=()=>begin(m);$('missions').append(b)}}
function begin(m){run={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),mission:m,index:0,xp:0,streak:0,records:[],mistakes:0,start:performance.now()};view('work');$('mission').textContent=m.title;render()}
function feedback(t,ok){$('feedback').textContent=t;$('feedback').className=ok?'good':'bad';$('feedback').classList.remove('flash');void $('feedback').offsetWidth;$('feedback').classList.add('flash')}
function add(n){run.xp+=n;$('sessionxp').textContent='+'+run.xp+' XP'}
function render(){token++;locked=false;stageStart=performance.now();selected='';cut.clear();$('sessionxp').textContent='+'+run.xp+' XP';$('streak').textContent=run.streak+' COMBO';$('steps').replaceChildren();for(let i=0;i<run.mission.tasks.length;i++){let s=document.createElement('span');s.className=i<run.index?'clear':i===run.index?'active':'';$('steps').append(s)}$('stage').textContent='工程 '+(run.index+1)+' / '+run.mission.tasks.length;$('feedback').textContent='';$('next').hidden=true;$('area').replaceChildren();const key=run.mission.tasks[run.index];run.mistakes=0;if(key==='cut'){renderCut();return}const q=questions[key];$('task').textContent=q.title;$('request').textContent=q.q;const grid=document.createElement('div');grid.className='grid';for(const n of shuffle(q.options.map((_,i)=>i))){let b=document.createElement('button');b.textContent=q.options[n];b.onclick=()=>{if(locked)return;if(n!==q.answer){run.mistakes++;run.streak=0;$('streak').textContent='0 COMBO';b.disabled=true;feedback('もう一度。'+q.why,false);return}locked=true;for(let el of grid.children)el.disabled=true;b.style.borderColor='#8bd6aa';complete(key,q.why)};grid.append(b)}$('area').append(grid)}
function complete(key,why){locked=true;const ok=run.mistakes===0;run.streak=ok?run.streak+1:0;const bonus=ok?30+Math.min(run.streak-1,4)*5:15;add(bonus);run.records.push({stage:key,firstTry:ok,mistakes:run.mistakes,seconds:Math.round((performance.now()-stageStart)/100)/10});$('streak').textContent=run.streak+' COMBO';feedback('GOOD！ +'+bonus+' XP　'+why,true);$('next').hidden=false}
function renderCut(){$('task').textContent='カット実習';$('request').textContent=run.mission.id==='finish'?'トップの毛量を調整し、サイドとえり足を整える。':'トップはシザー、サイドとえり足はクリッパーで整えよう。';let g=document.createElement('div');g.className='grid';for(let [id,label] of tools){let b=document.createElement('button');b.className='tool';b.textContent=label;b.onclick=()=>{if(locked)return;selected=id;for(const el of g.children)el.classList.remove('selected');b.classList.add('selected');feedback(label+'を手に取った。施術する場所をタップ。',true)};g.append(b)}let head=document.createElement('div');head.className='headzone';for(let name of ['head','ear','ear r']){let d=document.createElement('div');d.className=name;head.append(d)}for(let [id,label] of zones){let b=document.createElement('button');b.className='zone '+id;b.textContent=label;b.onclick=()=>{if(locked||cut.has(id))return;if(!selected){feedback('先に器具を選ぼう。',false);return}const need=id==='top'?(run.mission.id==='finish'?'thin':'scissors'):'clip';if(selected!==need){run.mistakes++;run.streak=0;$('streak').textContent='0 COMBO';feedback(id==='top'?(need==='thin'?'毛量調整にはセニングを選ぼう。':'トップはシザーで整えよう。'):'短い刈り上げにはクリッパーが適している。',false);return}cut.add(id);b.classList.add('cut');b.textContent='✓ '+label;b.disabled=true;add(5);feedback('GOOD！ '+label+'が整った。 +5 XP ('+cut.size+'/4)',true);if(cut.size===4){for(const el of g.children)el.disabled=true;complete('cut','全体の仕上がりが整った！')}};head.append(b)}$('area').append(g,head)}
function finish(){let data={game:'practice-room',runId:run.id,mission:run.mission.id,xp:run.xp,records:run.records,seconds:Math.round((performance.now()-run.start)/1000)};saved.xp+=run.xp;saved.completed++;if(!saved.cleared.includes(run.mission.id))saved.cleared.push(run.mission.id);save();view('result');const n=run.records.filter(x=>x.firstTry).length;$('grade').textContent=n===run.records.length?'Sランク！ 実習完了':'実習クリア！';$('earned').textContent='+'+run.xp+' XP';$('accuracy').textContent=n+' / '+run.records.length;$('review').replaceChildren();for(const rec of run.records.filter(x=>!x.firstTry)){let p=document.createElement('p');p.textContent='復習：'+(questions[rec.stage]?.why||'器具と施術部位の組み合わせ');$('review').append(p)}if(saved.completed===1){let p=document.createElement('p');p.className='good';p.textContent='新しい実習「仕上げの実習」が解放されました！';$('review').append(p)}let msg='国試 HTML実習結果：'+JSON.stringify(data)+'。https://github.com/public-studio/kokushi/blob/main/AGENTS.md を読み、結果を重複なく記録して復習してください。';$('gpt').onclick=()=>location.href='https://chatgpt.com/?q='+encodeURIComponent(msg);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(msg);$('copyStatus').textContent='コピーしました'}catch{$('copyStatus').textContent=msg}}}
$('next').onclick=()=>{if(!run||!locked)return;if(++run.index>=run.mission.tasks.length)finish();else render()};$('quit').onclick=lobby;$('again').onclick=lobby;setInterval(()=>{if(run&&!$('work').hidden){let s=Math.floor((performance.now()-run.start)/1000);$('clock').textContent='◷ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}},250);lobby();
</script></body></html>
