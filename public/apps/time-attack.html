function next(){if(!queue.length){finish('全問終了');return}current=queue.shift();choices=FIXED_SIDES[records.length]==='0'?[current.correct,current.wrong]:[current.wrong,current.correct];$('question').textContent=current.question;$('left').firstElementChild.textContent=choices[0];$('right').firstElementChild.textContent=choices[1];$('number').textContent='第'+(records.length+1)+'問';current.shown=performance.now()}
function updateHUD(){$('score').textContent=score.toLocaleString();$('combo').textContent=combo>=2?combo+' COMBO!':''}
function begin(){if(active)return;unlock();cancelAnimationFrame(frame);clearTimeout(flashTimer);queue=[...BANK];records=[];score=combo=maxCombo=0;lastTick=null;resetFlick();runId=globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);startDate=new Date().toISOString();$('delta').textContent='';$('card').classList.remove('good','bad');$('clock').classList.remove('urgent');active=true;show('play');updateHUD();deadline=performance.now()+DURATION;next();tone(440,.13);tone(660,.12,.12);tick()}
function tick(){if(!active)return;const remain=Math.max(0,deadline-performance.now()),sec=Math.ceil(remain/1000);$('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('bar').style.width=(remain/DURATION*100)+'%';$('clock').classList.toggle('urgent',sec<=10);if(sec<=5&&sec>0&&sec!==lastTick){tone(800,.05);lastTick=sec}if(remain<=0){finish('時間終了');return}frame=requestAnimationFrame(tick)}
function answer(side){if(!active)return;if(performance.now()>=deadline){finish('時間終了');return}const v=choices[side],ok=v===current.correct;score+=ok?100:-150;combo=ok?combo+1:0;maxCombo=Math.max(maxCombo,combo);records.push({questionId:current.id,question:current.question,answer:v,correct:current.correct,ok,seconds:Math.round((performance.now()-current.shown)/10)/100});$('delta').textContent=ok?'+100':'−150';$('delta').style.color=ok?'#7bf4c5':'#ff718b';$('card').classList.remove('good','bad');$('card').classList.add(ok?'good':'bad');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('card').classList.remove('good','bad'),150);if(ok){tone(520+Math.min(combo,12)*36,.085,0,'triangle')}else{tone(150,.13,0,'triangle')}updateHUD();next()}
function finish(reason){if(!active)return;active=false;resetFlick();cancelAnimationFrame(frame);clearTimeout(flashTimer);const correct=records.filter(r=>r.ok).length,n=records.length,accuracy=n?100*correct/n:0,rank=rankFor(score),prior=bestList()[0],isBest=n>0&&(!prior||score>prior.points);latest={game:'time-attack',version:3,runId,startedAt:startDate,date:new Date().toISOString(),durationSeconds:Math.min(60,Math.round((DURATION-Math.max(0,deadline-performance.now()))/100)/10),points:score,answered:n,correct,incorrect:n-correct,accuracy:Math.round(accuracy*10)/10,rank,maxCombo,records,reason};history.push(latest);let saved=true;try{localStorage.setItem(KEY,JSON.stringify(history))}catch{saved=false}$('rankcard').style.setProperty('--rank',colors[rank]);$('rank').textContent=rank;$('rank').style.fontSize=rank.length>2?'48px':rank.length>1?'56px':'72px';$('recordText').textContent=isBest?'✦ 自己ベスト更新！':reason;$('finalScore').textContent=score.toLocaleString();$('rankLabel').textContent='ランク '+rank;$('answered').textContent=n;$('accuracy').textContent=n?accuracy.toFixed(1)+'%':'—';$('maxCombo').textContent=maxCombo;$('breakdown').textContent='正解 '+correct+'問 ／ 不正解 '+(n-correct)+'問';$('review').replaceChildren();for(const r of records.filter(r=>!r.ok)){const d=document.createElement('div');d.className='wrongitem';d.textContent=r.question+'　あなたの答え：'+r.answer;const b=document.createElement('b');b.textContent='正解：'+r.correct;d.append(b);$('review').append(d)}if(!$('review').children.length)$('review').textContent=n?'全問正解！':'未回答';$('saved').textContent=saved?'このブラウザに自動保存しました':'このブラウザへの保存に失敗しました';$('copyStatus').textContent='';show('result');tone(440,.22);tone(550,.22,.15);tone(isBest?880:660,.3,.3)}
function message(){return '国試 HTMLミニゲーム結果：'+JSON.stringify(latest)+'。GitHub public-studio/kokushi の AGENTS.md と save.md を確認し、runIdで重複を防いでタイムアタックとして保存・復習してください。'}
function list(ranking){$('recordsTitle').textContent=ranking?'自己ランキング':'プレイ記録';$('recordList').replaceChildren();const data=ranking?bestList().slice(0,10):[...history].reverse();if(!data.length){const li=document.createElement('li');li.textContent='まだ記録がありません';$('recordList').append(li)}data.forEach((r,i)=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b'),c=document.createElement('span');a.textContent=(ranking?(i+1)+'位　':'')+new Date(r.date).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'});b.textContent=r.points.toLocaleString()+'点';c.textContent=r.rank+' / '+r.accuracy+'%';li.append(a,b,c);$('recordList').append(li)});show('records')}
$('start').onclick=$('retry').onclick=begin;$('left').onclick=()=>answer(0);$('right').onclick=()=>answer(1);$('returnHome').onclick=$('recordsBack').onclick=home;$('ranking').onclick=$('resultRanking').onclick=()=>list(true);$('history').onclick=()=>list(false);$('send').onclick=()=>location.href='https://chatgpt.com/?q='+encodeURIComponent(message());$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(message());$('copyStatus').textContent='コピーしました'}catch{$('copyStatus').textContent='コピーできませんでした'}};
function resetFlick(){const card=$('card');card.classList.remove('dragging');card.style.transform='';$('left').classList.remove('targeted');$('right').classList.remove('targeted');gesture=null}
$('card').addEventListener('pointerdown',e=>{if(!active||!e.isPrimary||e.button!==0)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};$('card').classList.add('dragging');try{$('card').setPointerCapture(e.pointerId)}catch{}});
$('card').addEventListener('pointermove',e=>{if(!active||!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;const horizontal=Math.abs(dx)>Math.abs(dy)*1.2;const offset=horizontal?Math.max(-85,Math.min(85,dx)):0;$('card').style.transform='translateX('+offset+'px) rotate('+(offset*.055)+'deg)';$('left').classList.toggle('targeted',horizontal&&dx< -38);$('right').classList.toggle('targeted',horizontal&&dx>38)});
$('card').addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;resetFlick();if(active&&Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy)*1.2)answer(dx<0?0:1)});
$('card').addEventListener('pointercancel',resetFlick);$('card').addEventListener('lostpointercapture',resetFlick);document.addEventListener('keydown',e=>{if(!active||e.repeat)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();answer(e.key==='ArrowLeft'?0:1)}});document.addEventListener('visibilitychange',()=>{if(active&&performance.now()>=deadline)finish('時間終了')});soundUI();home();
</script></body></html>
