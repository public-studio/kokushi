function answer(side){if(!active)return;const now=performance.now();if(!feverOn(now)&&remaining(now)<=0){finish('時間終了');return}expireCombo(now);const v=choices[side],ok=v===current.correct,f=feverOn(now),continued=ok&&combo>0,points=ok?(f?200:100):-150;score+=points;combo=ok?combo+1:0;comboWarned=false;if(ok){comboWindow=combo>=20?3000:combo>=10?3500:4000;comboUntil=now+comboWindow;if(f)feverCorrect++}else{comboUntil=0;nextFever=FEVER_STEP}maxCombo=Math.max(maxCombo,combo);if(ok&&combo%5===0)restartEffect($('play'),'combo-pop');let triggered=false;if(ok&&combo>=nextFever){if(!f){startFever(now);triggered=true}else{nextFever=combo+FEVER_STEP}}
records.push({questionId:current.id,question:current.question,answer:v,correct:current.correct,ok,seconds:Math.round((now-current.shown)/10)/100,combo,comboContinued:continued,fever:f,points});$('delta').textContent=triggered?'+100　FEVER!':ok?'+'+points+(f?'　×2':''):'−150';$('delta').style.color=ok?(f||triggered?'#ffe38b':'#7bf4c5'):'#ff718b';$('card').classList.remove('good','bad');$('card').classList.add(ok?'good':'bad');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('card').classList.remove('good','bad'),150);if(ok&&!triggered){const c=combo;playSound(()=>{if(active)hitSound(c,f)})}else if(!ok){playSound(()=>{if(active)missSound()})}updateHUD();drawMeters(now);next()}
function finish(reason){if(!active)return;active=false;resetFlick();cancelAnimationFrame(frame);clearTimeout(flashTimer);const correct=records.filter(r=>r.ok).length,n=records.length,accuracy=n?100*correct/n:0,comboRate=n?100*records.filter(r=>r.comboContinued).length/n:0,rank=rankFor(score),prior=bestList()[0],isBest=n>0&&(!prior||score>prior.points);latest={game:'time-attack',version:RULE_VERSION,runId,startedAt:startDate,date:new Date().toISOString(),durationSeconds:Math.round((performance.now()-startedMono)/100)/10,bonusSeconds:bonusMs/1000,feverCount,feverCorrect,points:score,answered:n,correct,incorrect:n-correct,accuracy:Math.round(accuracy*10)/10,rank,maxCombo,comboRate:Math.round(comboRate*10)/10,records,reason};history.push(latest);let saved=true;try{localStorage.setItem(KEY,JSON.stringify(history))}catch{saved=false}$('rankcard').style.setProperty('--rank',colors[rank]);$('rank').textContent=rank;$('rank').style.fontSize=rank.length>2?'48px':rank.length>1?'56px':'72px';$('recordText').textContent=isBest?'✦ 自己ベスト更新！':reason;$('finalScore').textContent=score.toLocaleString();$('rankLabel').textContent='ランク '+rank;$('answered').textContent=n;$('accuracy').textContent=n?accuracy.toFixed(1)+'%':'—';$('maxCombo').textContent=maxCombo;$('comboRate').textContent=n?comboRate.toFixed(1)+'%':'—';$('breakdown').textContent='正解 '+correct+'問 ／ 不正解 '+(n-correct)+'問';$('feverResult').textContent='フィーバー '+feverCount+'回 ／ 時間ボーナス +'+bonusMs/1000+'秒';$('review').replaceChildren();for(const r of records.filter(r=>!r.ok)){const d=document.createElement('div');d.className='wrongitem';d.textContent=r.question+'　あなたの答え：'+r.answer;const b=document.createElement('b');b.textContent='正解：'+r.correct;d.append(b);$('review').append(d)}if(!$('review').children.length)$('review').textContent=n?'全問正解！':'未回答';$('saved').textContent=saved?'このブラウザに自動保存しました':'このブラウザへの保存に失敗しました';$('copyStatus').textContent='';show('result');endSound(isBest,n===BANK.length&&maxCombo===BANK.length)}
function message(){return '国試 HTMLミニゲーム結果：'+JSON.stringify(latest)+'。GitHub public-studio/kokushi の AGENTS.md と save.md を確認し、runIdで重複を防いでタイムアタックとして保存・復習してください。'}
function list(ranking){$('recordsTitle').textContent=ranking?'自己ランキング（フィーバー版）':'プレイ記録';$('recordList').replaceChildren();const data=ranking?bestList().slice(0,10):[...history].reverse();if(!data.length){const li=document.createElement('li');li.textContent='まだ記録がありません';$('recordList').append(li)}data.forEach((r,i)=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b'),c=document.createElement('span');a.textContent=(ranking?(i+1)+'位　':'')+new Date(r.date).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo'});b.textContent=r.points.toLocaleString()+'点';c.textContent=r.rank+' / '+r.accuracy+'%'+(r.version===RULE_VERSION?'':'（旧）');li.append(a,b,c);$('recordList').append(li)});show('records')}
$('start').onclick=$('retry').onclick=begin;$('left').onclick=()=>answer(0);$('right').onclick=()=>answer(1);$('returnHome').onclick=$('recordsBack').onclick=home;$('ranking').onclick=$('resultRanking').onclick=()=>list(true);$('history').onclick=()=>list(false);$('send').onclick=()=>location.href='https://chatgpt.com/?q='+encodeURIComponent(message());$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(message());$('copyStatus').textContent='コピーしました'}catch{$('copyStatus').textContent='コピーできませんでした'}};
function resetFlick(){const card=$('card');card.classList.remove('dragging');card.style.transform='';$('left').classList.remove('targeted');$('right').classList.remove('targeted');gesture=null}
$('card').addEventListener('pointerdown',e=>{if(!active||!e.isPrimary||e.button!==0)return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};$('card').classList.add('dragging');try{$('card').setPointerCapture(e.pointerId)}catch{}});
$('card').addEventListener('pointermove',e=>{if(!active||!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;const horizontal=Math.abs(dx)>Math.abs(dy)*1.2;const offset=horizontal?Math.max(-85,Math.min(85,dx)):0;$('card').style.transform='translateX('+offset+'px) rotate('+(offset*.055)+'deg)';$('left').classList.toggle('targeted',horizontal&&dx< -38);$('right').classList.toggle('targeted',horizontal&&dx>38)});
$('card').addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;resetFlick();if(active&&Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy)*1.2)answer(dx<0?0:1)});
$('card').addEventListener('pointercancel',resetFlick);$('card').addEventListener('lostpointercapture',resetFlick);document.addEventListener('keydown',e=>{if(!active||e.repeat)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();answer(e.key==='ArrowLeft'?0:1)}});document.addEventListener('visibilitychange',()=>{if(active&&!feverOn(performance.now())&&remaining(performance.now())<=0)finish('時間終了')});home();
</script></body></html>
